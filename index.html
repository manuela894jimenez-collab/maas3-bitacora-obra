<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAAS3 · Bitácora de obra</title>
  <link rel="apple-touch-icon" href="/maas3-icon.png">
<link rel="icon" type="image/png" href="/maas3-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #F7F7F4;
    --paper: #FFFFFF;
    --ink: #262626;
    --ink-soft: #7D7D7D;
    --line: #E6E6E1;
    --line-strong: #CDCDC6;
    --lime: #C9E600;
    --lime-ink: #3C4600;
    --blue: #575757;
    --blue-soft: #EFEFEB;
    --amber: #D98B2B;
    --amber-soft: #F7E9D2;
    --moss: #6E8A00;
    --moss-soft: #F1FAD1;
    --rust: #B3452C;
    --rust-soft: #F4E1DA;
    --radius: 3px;
    --shadow: 0 1px 2px rgba(38,38,38,0.06), 0 4px 14px rgba(38,38,38,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      linear-gradient(var(--bg) 0%, var(--bg) 100%);
    background-color:var(--bg);
    background-image:
      linear-gradient(rgba(38,38,38,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(38,38,38,0.035) 1px, transparent 1px);
    background-size: 36px 36px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Poppins',sans-serif;}
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:220px;flex-shrink:0;
    background:var(--paper);
    border-right:1px solid var(--line);
    padding:22px 14px;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:9px;padding:0 8px 22px 8px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .brand-mark{height:30px;width:auto;flex-shrink:0;display:block;}
  .brand-name{text-transform:uppercase;}
  .brand-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;letter-spacing:.2px;}
  .brand-sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-soft);letter-spacing:1px;text-transform:uppercase;}
  nav.nav-links{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-link{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:var(--radius);
    color:var(--ink-soft);text-decoration:none;font-size:13.5px;font-weight:500;
    cursor:pointer;border:1px solid transparent;
  }
  .nav-link:hover{background:var(--blue-soft);color:var(--ink);}
  .nav-link.active{background:var(--lime);color:var(--lime-ink);}
  .nav-link .ico{width:16px;text-align:center;font-size:13px;opacity:.85;}
  .nav-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:8px;font-size:12px;color:var(--ink-soft);}

  /* Topbar mobile */
  .topbar{display:none;}
  .topbar-nav{display:none;}

  main{flex:1;min-width:0;padding:30px 34px 90px 34px;}
  .container{max-width:980px;margin:0 auto;}

  h1.page-title{font-family:'Poppins',sans-serif;font-size:26px;margin:0 0 3px 0;font-weight:700;}
  .page-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:14px;flex-wrap:wrap;}

  .btn{
    font-family:'Inter',sans-serif;font-weight:700;font-size:13px;
    border-radius:var(--radius);border:1px solid var(--lime);
    padding:9px 14px;cursor:pointer;background:var(--lime);color:var(--lime-ink);
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{opacity:.88;}
  .btn.secondary{background:var(--paper);color:var(--ink);}
  .btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink-soft);}
  .btn.small{padding:6px 10px;font-size:12px;}
  .btn.danger{background:var(--rust);border-color:var(--rust);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* stat cards */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;}
  .stat-card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px 16px;cursor:pointer;position:relative;overflow:hidden;
  }
  .stat-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow);}
  .stat-card .num{font-family:'Poppins',sans-serif;font-size:30px;font-weight:700;line-height:1;}
  .stat-card .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:6px;font-weight:600;}
  .stat-card.warn .num{color:var(--rust);}
  .stat-card .tab{position:absolute;top:0;right:0;width:34px;height:8px;background:var(--line);border-bottom-left-radius:4px;}
  .stat-card.warn .tab{background:var(--rust);}

  section.block{margin-bottom:30px;}
  .block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
  .block-title{font-family:'Poppins',sans-serif;font-size:14.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink);}
  .block-title .count{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-weight:500;text-transform:none;letter-spacing:0;}

  /* task ticket card */
  .ticket{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;
    border-left:3px solid var(--line-strong);
    position:relative;
  }
  .ticket:hover{box-shadow:var(--shadow);border-left-color:var(--blue);}
  .ticket.priority-Alta{border-left-color:var(--rust);}
  .ticket.priority-Normal{border-left-color:var(--blue);}
  .ticket.priority-Baja{border-left-color:var(--line-strong);}
  .ticket.completed{opacity:.55;}
  .ticket.completed .t-name{text-decoration:line-through;}
  .ticket.onhold{border-left-color:var(--amber);border-left-style:dashed;}
  .check{
    width:18px;height:18px;border-radius:3px;border:1.6px solid var(--line-strong);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:11px;color:var(--lime-ink);font-weight:800;
  }
  .check.done{background:var(--lime);border-color:var(--lime);}
  .t-main{flex:1;min-width:0;}
  .t-name{font-weight:600;font-size:14px;color:var(--ink);}
  .t-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--line-strong);display:inline-block;}
  .stamp{
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.5px;
    padding:2px 7px;border-radius:2px;text-transform:uppercase;white-space:nowrap;
  }
  .stamp.Alta{background:var(--rust-soft);color:var(--rust);}
  .stamp.Normal{background:var(--blue-soft);color:var(--blue);}
  .stamp.Baja{background:var(--line);color:var(--ink-soft);}
  .stamp.hold{background:var(--amber-soft);color:var(--amber);}
  .stamp.due{background:var(--rust-soft);color:var(--rust);}
  .t-project{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--blue);white-space:nowrap;}
  .t-arrow{color:var(--ink-soft);font-size:13px;flex-shrink:0;}

  .empty{
    border:1px dashed var(--line-strong);border-radius:var(--radius);padding:26px;text-align:center;
    color:var(--ink-soft);font-size:13px;background:rgba(255,255,255,.4);
  }

  /* project cards */
  .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .proj-card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;cursor:pointer;position:relative;
  }
  .proj-card:hover{box-shadow:var(--shadow);border-color:var(--line-strong);}
  .proj-status{position:absolute;top:14px;right:14px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:var(--moss-soft);color:var(--moss);}
  .proj-status.Pausa{background:var(--amber-soft);color:var(--amber);}
  .proj-status.Finalizado{background:var(--line);color:var(--ink-soft);}
  .proj-status.Pendiente{background:var(--blue-soft);color:var(--blue);}
  .proj-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;margin-bottom:8px;padding-right:70px;}
  .proj-line{font-size:12px;color:var(--ink-soft);margin-bottom:3px;}
  .proj-line b{color:var(--ink);font-weight:600;}
  .proj-line.warn b{color:var(--rust);}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .chip{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;
    padding:6px 11px;border-radius:20px;border:1px solid var(--line-strong);
    color:var(--ink-soft);cursor:pointer;background:var(--paper);
  }
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .quick-btns .chip.selected{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .tab-btn{
    padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--ink);}

  .act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
  .act-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;}
  .act-card:hover{box-shadow:var(--shadow);border-color:var(--line-strong);}
  .act-card .num{font-family:'Poppins',sans-serif;font-size:24px;font-weight:700;}
  .act-card .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

  table.data{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  table.data th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--ink-soft);padding:9px 12px;border-bottom:1px solid var(--line);background:rgba(47,92,138,0.03);
  }
  table.data td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;}
  table.data tr:last-child td{border-bottom:none;}
  table.data tr{cursor:pointer;}
  table.data tr:hover td{background:var(--blue-soft);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(22,35,59,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--paper);border-radius:6px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .modal-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:17px;}
  .modal-close{cursor:pointer;color:var(--ink-soft);font-size:18px;border:none;background:none;padding:2px 6px;}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px;font-family:'IBM Plex Mono',monospace;}
  .field input[type=text],.field input[type=date],.field select,.field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);
    font-family:'Inter',sans-serif;font-size:13.5px;background:var(--bg);color:var(--ink);
  }
  .field input.big{font-family:'Poppins',sans-serif;font-size:17px;font-weight:600;padding:11px 10px;}
  .field textarea{resize:vertical;min-height:64px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .quick-btns{display:flex;gap:8px;}
  .quick-btns .chip{padding:8px 14px;}
  .quick-btns .chip.selected{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  details.more{margin-top:4px;}
  details.more summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--blue);margin-bottom:10px;}

  .detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .detail-row .k{color:var(--ink-soft);}
  .detail-row .v{font-weight:600;text-align:right;}
  .detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;}
  .hold-box{background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--radius);padding:12px 14px;margin:14px 0;font-size:13px;}
  .hold-box b{color:var(--amber);}
  .menu-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}

  .fab{
    position:fixed;bottom:26px;right:34px;width:52px;height:52px;border-radius:50%;
    background:var(--lime);color:var(--lime-ink);border:none;font-size:26px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 20px rgba(201,230,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;
  }
  .fab:hover{opacity:.9;}
  .fab-menu{position:fixed;bottom:88px;right:34px;background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);z-index:51;overflow:hidden;min-width:190px;}
  .fab-menu-item{padding:12px 16px;font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:1px solid var(--line);}
  .fab-menu-item:last-child{border-bottom:none;}
  .fab-menu-item:hover{background:var(--blue-soft);}

  .banner{
    background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:20px;
  }
  .banner-title{font-weight:700;font-size:13.5px;margin-bottom:8px;color:#7A5215;}
  .banner-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-top:1px solid rgba(217,139,43,.25);}
  .banner-row:first-of-type{border-top:none;}
  .banner-actions{display:flex;gap:5px;}
  .banner-actions button{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:4px 8px;border-radius:2px;border:1px solid var(--amber);background:transparent;color:#7A5215;cursor:pointer;}
  .banner-actions button:hover{background:var(--amber);color:#fff;}

  .progress-wrap{background:var(--line);border-radius:20px;height:6px;width:100%;overflow:hidden;margin:10px 0 18px 0;}
  .progress-fill{background:var(--lime);height:100%;border-radius:20px;}

  .multiselect-bar{
    position:sticky;bottom:0;background:var(--ink);color:var(--paper);border-radius:var(--radius);
    padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;
  }
  .multiselect-bar .actions{display:flex;gap:6px;}
  .multiselect-bar button{font-size:12px;padding:6px 10px;border-radius:3px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--paper);cursor:pointer;font-weight:600;}
  .multiselect-bar button:hover{background:rgba(255,255,255,.12);}

  select.mini{width:auto;padding:4px 6px;font-size:12px;border-radius:2px;border:1px solid var(--line-strong);background:var(--paper);}

  .note{font-size:11.5px;color:var(--ink-soft);margin-top:16px;padding-top:14px;border-top:1px dashed var(--line-strong);}

  /* cronograma / stages */
  .stage-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
  .stage-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;}
  .stage-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:14.5px;}
  .stage-dates{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .stage-variation{font-size:11.5px;color:var(--amber);font-weight:700;margin-top:3px;}
  .stage-track{position:relative;height:8px;background:var(--line);border-radius:4px;margin-top:12px;}
  .stage-bar{position:absolute;top:0;height:100%;border-radius:4px;}
  .stage-bar.planned{background:var(--line-strong);}
  .stage-bar.current{background:var(--lime);height:4px;top:2px;box-shadow:0 0 0 1px var(--paper);}
  .stage-notes{font-size:12.5px;color:var(--ink-soft);margin-top:8px;font-style:italic;}

  /* gantt / excel-style cronograma */
  .gantt-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
  table.gantt{border-collapse:collapse;font-size:11.5px;min-width:100%;}
  table.gantt th{
    background:#2E2E2E;color:#F2F2F0;font-family:'IBM Plex Mono',monospace;font-weight:600;
    text-transform:uppercase;letter-spacing:.3px;padding:6px 4px;text-align:center;white-space:nowrap;
    border:1px solid #444;font-size:10.5px;
  }
  table.gantt th.gantt-corner{background:#2E2E2E;}
  table.gantt td.gantt-fixed, table.gantt th.gantt-fixed{
    position:sticky;left:0;background:var(--paper);color:var(--ink);text-align:left;
    text-transform:none;font-family:'Inter',sans-serif;white-space:nowrap;z-index:2;
  }
  table.gantt th.gantt-fixed{background:#2E2E2E;color:#F2F2F0;z-index:3;}
  table.gantt td.gantt-chapter{
    font-weight:700;font-size:11px;text-transform:uppercase;color:var(--ink-soft);
    background:var(--bg);border-right:1px solid var(--line-strong);left:0;min-width:130px;max-width:150px;white-space:normal;
  }
  table.gantt td.gantt-activity{
    left:150px;min-width:190px;max-width:220px;white-space:normal;border-right:1px solid var(--line);
    padding:5px 8px;font-size:11.5px;
  }
  table.gantt th.gantt-fixed:nth-child(1){min-width:130px;max-width:150px;}
  table.gantt th.gantt-fixed:nth-child(2){left:150px;min-width:190px;max-width:220px;}
  table.gantt td, table.gantt th{border:1px solid var(--line);}
  td.gantt-cell{width:26px;min-width:26px;padding:0;height:24px;background:var(--paper);}
  td.gantt-adjudicacion{background:#4F7CAC;}
  td.gantt-ejecucion{background:var(--lime);}
  td.gantt-revisar{background:#F2C94C;}
  .gantt-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-soft);}
  .gantt-legend-item{display:flex;align-items:center;gap:6px;}
  .gantt-legend-item i{width:14px;height:14px;border-radius:2px;display:inline-block;}
  .gantt-legend-item i.gantt-adjudicacion{background:#4F7CAC;}
  .gantt-legend-item i.gantt-ejecucion{background:var(--lime);}
  .gantt-legend-item i.gantt-revisar{background:#F2C94C;}

  @media (max-width: 860px){
    .sidebar{display:none;}
    .topbar{
      display:flex;position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);
      padding:10px 14px;align-items:center;justify-content:space-between;
    }
    .topbar .brand{border:none;padding:0;margin:0;}
    .topbar-nav{display:flex;gap:4px;overflow-x:auto;padding:8px 14px 12px 14px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:39;}
    .topbar-nav .nav-link{white-space:nowrap;font-size:12.5px;padding:7px 10px;}
    main{padding:18px 14px 90px 14px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .field-row{grid-template-columns:1fr;}
    .fab{right:18px;bottom:18px;}
    .fab-menu{right:18px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
/* ============ CONFIG / SEED ============ */
const TODAY = new Date().toISOString().slice(0,10);
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const PRIORITIES = ["Alta","Normal","Baja"];
const WEEKS = [
  {v:"esta", l:"Esta semana"},
  {v:"proxima", l:"Próxima semana"},
  {v:null, l:"Sin programar"}
];

function seedData(){
  return {
    users: [
      {id:"u1", name:"Pedro Mesa", role:""},
      {id:"u2", name:"David Mesa", role:""},
      {id:"u3", name:"Andres Felipe Acebedo", role:""}
    ],
    projects: [], tasks: [], activities: [], nextTaskNum: 1, currentUserId: null
  };
}
/* ============ STATE ============ */
let DATA = null;

      async get(key){
            try{
                    const res = await fetch(SUPABASE_URL+"/rest/v1/app_storage?key=eq."+encodeURIComponent(key)+"&select=value", {
                              headers:{ apikey: SUPABASE_KEY, Authorization: "Bearer "+SUPABASE_KEY }

                    const rows = await res.json();
                    if(!rows || !rows.length) return null;
                    return { key, value: rows[0].value };
            }catch(e){
                    console.error("Supabase get failed, using local copy:", e);
                    const v = localStorage.getItem("obra:"+key);
                    return v===null ? null : {key, value:v};
            }
      },
      async set(key, value){
            localStorage.setItem("obra:"+key, value);
            try{
                    const res = await fetch(SUPABASE_URL+"/rest/v1/app_storage", {
                              method:"POST",
                              headers:{ apikey: SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
                              body: JSON.stringify([{key, value}])
                    });
                    if(!res.ok) throw new Error("http "+res.status);
            }catch(e){ console.error("Supabase set failed (saved locally only):", e); }
            return {key, value};
      }
  };

/* ============ HELPERS ============ */
function byId(arr,id){ return arr.find(x=>x.id===id); }
function userName(uid){ const u = byId(DATA.users,uid); return u? u.name : "—"; }
function projectName(pid){ if(!pid) return "Personal"; const p = byId(DATA.projects,pid); return p? p.name : "—"; }
function taskById(tid){ return byId(DATA.tasks,tid); }
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtLongDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return `${DIAS[dt.getDay()]} ${d} de ${MESES[m-1]}, ${y}`;
}
function fmtDate(iso){
  if(!iso) return null;
  const [y,m,d] = iso.split("-").map(Number);
  return `${d} ${MESES[m-1]}`;
}
function isPast(iso){ return iso && iso < TODAY; }
function isOverdue(t){ return !t.completed && !t.onHold && t.deadline && isPast(t.deadline); }
function activeTasks(){ return DATA.tasks.filter(t=>!t.completed); }
function myActiveTasks(){ return DATA.tasks.filter(t=>!t.completed && t.responsible===LOCAL_USER); }
function myDayTasks(){ return DATA.tasks.filter(t=>t.inMyDay && !t.completed); }
function myDayTasksToday(){ return DATA.tasks.filter(t=>t.inMyDay && !t.completed && t.myDayDate===TODAY); }
function staleMyDayTasks(){ return DATA.tasks.filter(t=>t.inMyDay && !t.completed && t.myDayDate && t.myDayDate!==TODAY); }
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function setView(view, extra){
  ui.view = view; ui.modal=null; ui.fabOpen=false; ui.selectedTaskIds=new Set();
  if(extra) Object.assign(ui, extra);
  render();
}
function openModal(type, payload){ ui.modal = {type, payload: payload||{}}; render(); }
function closeModal(){ ui.modal = null; render(); }

async function mutate(fn){
  fn();
  await saveData();
  render();
}

/* ============ TASK OPS ============ */
function newTaskTemplate(overrides){
  return Object.assign({
    id: "t"+(DATA.nextTaskNum++),
    name:"", projectId:null, activity:(DATA.activities&&DATA.activities[0])||"", responsible: LOCAL_USER,
    priority:"Normal", week:"esta", deadline:null, repeat:"none",
    completed:false, onHold:false, inMyDay:false, description:""
  }, overrides||{});
}

/* ============ RECURRING TASKS ============ */
function addDaysISO(iso, days){
  const d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function addMonthISO(iso){
  const d = new Date(iso+"T00:00:00");
  d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function nextRecurrenceDeadline(deadline, repeat){
  if(!deadline) return null;
  if(repeat==="quincenal") return addDaysISO(deadline, 15);
  if(repeat==="mensual") return addMonthISO(deadline);
  return null;
}
function maybeSpawnRecurrence(task){
  if(!task || !task.repeat || task.repeat==="none") return;
  const nextDeadline = nextRecurrenceDeadline(task.deadline, task.repeat);
  if(!nextDeadline) return;
  DATA.tasks.push(newTaskTemplate({
    name: task.name, projectId: task.projectId, activity: task.activity,
    responsible: task.responsible, priority: task.priority, week: null,
    deadline: nextDeadline, repeat: task.repeat, description: task.description||""
  }));
}

function renderFabMenu(){
  let items = [
    {a:"newTask", l:"Nueva tarea"},
    {a:"quickTask", l:"Tarea rápida"},
    {a:"newProject", l:"Nuevo proyecto"}
  ];
  return `<div class="fab-menu">
    ${items.map(i=>`<div class="fab-menu-item" data-fab="${i.a}">${i.l}</div>`).join("")}
  </div>`;
}

  return `

function taskTicket(t, opts){
  opts = opts||{};
  const overdue = isOverdue(t);
  const cls = ["ticket"];
  if(t.completed) cls.push("completed");
  if(t.onHold) cls.push("onhold"); else cls.push("priority-"+t.priority);
  return `
  <div class="${cls.join(' ')}" data-open-task="${t.id}">
    ${opts.checkbox!==false ? `<div class="check ${t.completed?'done':''}" data-toggle-complete="${t.id}">${t.completed?'✓':''}</div>`:""}
    ${opts.select ? `<input type="checkbox" data-select-task="${t.id}" ${ui.selectedTaskIds.has(t.id)?'checked':''} style="width:16px;height:16px;flex-shrink:0;" onclick="event.stopPropagation()">`:""}

        <span class="dot"></span>
        <span>${userName(t.responsible)}</span>
        ${t.onHold?`<span class="stamp hold">En espera</span>`:`<span class="stamp ${t.priority}">${t.priority}</span>`}

async function handleExcelImport(ev){
  const file = ev.target.files && ev.target.files[0];
  const targetProjectId = excelImportProjectId;
  ev.target.value = "";
  if(!file || !targetProjectId) return;
  if(typeof XLSX === "undefined"){ alert("No se pudo cargar el lector de Excel. Revisa tu conexión e intenta de nuevo."); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array", cellStyles:true});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    if(!sheet || !sheet["!ref"]) throw new Error("hoja vacía");
    const range = XLSX.utils.decode_range(sheet["!ref"]);
    const cellAt = (r,c) => sheet[XLSX.utils.encode_cell({r,c})];

    // Find the week-header row (the row containing "S-1", "S-2", ...)
    let weekRow = -1, weekCols = [];
    for(let r=range.s.r; r<=range.e.r; r++){
      const matches = [];
      for(let c=range.s.c; c<=range.e.c; c++){
        const cell = cellAt(r,c);
        if(cell && typeof cell.v === "string" && /^S-?\d+$/i.test(cell.v.trim())) matches.push(c);
      }
      if(matches.length >= 3){ weekRow = r; weekCols = matches; break; }
    }
    if(weekRow === -1) throw new Error("no se detectó la fila de semanas (S-1, S-2, ...)");
    const totalWeeks = weekCols.length;
    const weekStartCol = weekCols[0];

    // Month grouping from the row above, using merged cell spans when available
    const monthRow = weekRow - 1;
    let monthWeeks = [];
    if(monthRow >= range.s.r){
      const merges = sheet["!merges"] || [];
      let c = weekStartCol;
      const lastWeekCol = weekCols[weekCols.length-1];
      while(c <= lastWeekCol){
        const merge = merges.find(m => m.s.r===monthRow && m.s.c===c && m.e.r===monthRow);
        if(merge){ monthWeeks.push(merge.e.c - merge.s.c + 1); c = merge.e.c + 1; }
        else { monthWeeks.push(1); c++; }
      }
    }
    if(!monthWeeks.length || monthWeeks.reduce((a,b)=>a+b,0) !== totalWeeks){
      monthWeeks = []; let left = totalWeeks;
      while(left > 0){ const take = Math.min(4,left); monthWeeks.push(take); left -= take; }
    }

    // Classify a cell's fill color into our three segment types
    function classify(cell){
      if(!cell || !cell.s || !cell.s.fgColor) return null;
      let rgbHex = cell.s.fgColor.rgb;
      if(!rgbHex) return null;
      const hex = rgbHex.length === 8 ? rgbHex.slice(2) : rgbHex;
      const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
      if(isNaN(r) || isNaN(g) || isNaN(b)) return null;
      if(r>235 && g>235 && b>235) return null;
      const targets = {adjudicacion:[79,124,172], ejecucion:[190,220,20], revisar:[242,201,76]};
      let best = null, bestDist = Infinity;
      for(const k in targets){
        const t = targets[k];
        const d = (r-t[0])**2 + (g-t[1])**2 + (b-t[2])**2;
        if(d < bestDist){ bestDist = d; best = k; }
      }
      return best;
    }

    // Walk data rows below the week header, grouping by chapter (column A, merged/blank-filled-down) and activity (column B)
    const chapters = [];
    let currentChapter = null, lastChapterName = "", emptyStreak = 0;
    for(let r=weekRow+1; r<=range.e.r; r++){
      const chapCell = cellAt(r,0), descCell = cellAt(r,1);
      const chapVal = (chapCell && chapCell.v!=null) ? String(chapCell.v).trim() : "";
      const descVal = (descCell && descCell.v!=null) ? String(descCell.v).trim() : "";
      if(!chapVal && !descVal){ emptyStreak++; if(emptyStreak>=2) break; continue; }
      emptyStreak = 0;
      if(chapVal) lastChapterName = chapVal;
      if(!descVal) continue;
      let segments = [], curType = null, curStart = null;
      for(let i=0;i<weekCols.length;i++){
        const type = classify(cellAt(r, weekCols[i]));
        const weekNum = i+1;
        if(type !== curType){
          if(curType) segments.push({type:curType, start:curStart, end:weekNum-1});
          curType = type; curStart = weekNum;
        }
      }
      if(curType) segments.push({type:curType, start:curStart, end:weekCols.length});
      if(!segments.length) continue;
      if(!currentChapter || currentChapter.name !== (lastChapterName || "General")){
        currentChapter = {name: lastChapterName || "General", activities:[]};
        chapters.push(currentChapter);
      }
      currentChapter.activities.push({name:descVal, segments});
    }
    if(!chapters.length) throw new Error("no se encontraron actividades con celdas de color reconocibles");

    const gantt = {totalWeeks, monthWeeks, chapters};
    await mutate(()=>{
      const proj = byId(DATA.projects, targetProjectId);
      if(proj) proj.gantt = gantt;
    });
  }catch(err){
    console.error("Excel import error:", err);
    alert("No pude leer el cronograma de ese archivo. Revisa que tenga una fila con encabezados 'S-1, S-2, ...' por semana y celdas coloreadas para cada actividad.");
  }
}
function shiftDate(iso, days){
  const d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function renderGanttTable(p){
  const g = p.gantt;
  const monthLabels = g.monthWeeks.map((n,i)=>({label:"MES "+(i+1), span:n}));
  let weekNum = 1;
  const weekHeaders = [];
  for(let i=0;i<g.totalWeeks;i++){ weekHeaders.push(weekNum++); }
  function cellFor(activity, week){
    const seg = activity.segments.find(s=>week>=s.start && week<=s.end);
    if(!seg) return `<td class="gantt-cell"></td>`;
    return `<td class="gantt-cell gantt-${seg.type}"></td>`;
  }
  let bodyRows = "";
  g.chapters.forEach(ch=>{
    ch.activities.forEach((act,i)=>{
      bodyRows += `<tr>`;
      if(i===0) bodyRows += `<td class="gantt-fixed gantt-chapter" rowspan="${ch.activities.length}">${esc(ch.name)}</td>`;
      bodyRows += `<td class="gantt-fixed gantt-activity">${esc(act.name)}</td>`;
      weekHeaders.forEach(w=> bodyRows += cellFor(act, w));
      bodyRows += `</tr>`;
    });
  });
  return `
  <div class="gantt-scroll">
    <table class="gantt">
      <thead>
        <tr>
          <th class="gantt-fixed gantt-corner" colspan="2"></th>
          ${monthLabels.map(m=>`<th colspan="${m.span}">${m.label}</th>`).join("")}
        </tr>
        <tr>
          <th class="gantt-fixed">CAPÍTULO</th>
          <th class="gantt-fixed">DESCRIPCIÓN ACTIVIDAD</th>
          ${weekHeaders.map(w=>`<th class="gantt-week">S-${w}</th>`).join("")}
        </tr>
      </thead>
      <tbody>${bodyRows}</tbody>
    </table>
  </div>
  <div class="gantt-legend">
    <span class="gantt-legend-item"><i class="gantt-adjudicacion"></i> Período de adjudicación</span>
    <span class="gantt-legend-item"><i class="gantt-ejecucion"></i> Período de ejecución</span>
    <span class="gantt-legend-item"><i class="gantt-revisar"></i> Por revisar inicio</span>
  </div>`;
}
function stageCard(st, p){
  const totalMs = new Date(p.due+"T00:00:00") - new Date(p.start+"T00:00:00");
  const pct = (d)=>{ if(!d || totalMs<=0) return 0; const v=(new Date(d+"T00:00:00")-new Date(p.start+"T00:00:00"))/totalMs*100; return Math.max(0,Math.min(100,v)); };
  const planLeft = pct(st.plannedStart), planRight = pct(st.plannedEnd);
  const curStart = st.currentStart||st.plannedStart, curEnd = st.currentEnd||st.plannedEnd;
  const curLeft = pct(curStart), curRight = pct(curEnd);
  const moved = (curStart!==st.plannedStart || curEnd!==st.plannedEnd);
  const statusLabel = st.status==="terminada"?"Terminada":st.status==="ejecucion"?"En ejecución":"Pendiente";
  const badgeStyle = st.status==="terminada"?"background:var(--moss-soft);color:var(--moss);":st.status==="ejecucion"?"background:var(--amber-soft);color:var(--amber);":"background:var(--line);color:var(--ink-soft);";
  let variation = "";
  if(moved && st.plannedEnd && curEnd){
    const diffDays = Math.round((new Date(curEnd+"T00:00:00") - new Date(st.plannedEnd+"T00:00:00"))/86400000);
    variation = `<div class="stage-variation">Variación: ${diffDays>0?'+':''}${diffDays} día${Math.abs(diffDays)===1?'':'s'}</div>`;
  }
  return `
  <div class="stage-card">
    <div class="stage-top">
      <div class="stage-name">${esc(st.name)}</div>
      <span class="stamp" style="${badgeStyle}">${statusLabel}</span>
    </div>
    <div class="stage-dates">Planificado: ${fmtDate(st.plannedStart)||'—'} — ${fmtDate(st.plannedEnd)||'—'}${moved?` · Actual: ${fmtDate(curStart)||'—'} — ${fmtDate(curEnd)||'—'}`:""}</div>
    ${variation}
    <div class="stage-track">
      <div class="stage-bar planned" style="left:${planLeft}%;width:${Math.max(1,planRight-planLeft)}%;"></div>
      ${moved? `<div class="stage-bar current" style="left:${curLeft}%;width:${Math.max(1,curRight-curLeft)}%;"></div>` : ""}
    </div>
    ${st.notes? `<div class="stage-notes">${esc(st.notes)}</div>` : ""}
    <button class="btn ghost small" data-move-stage="${st.id}" data-project="${p.id}" style="margin-top:10px;">Mover etapa</button>
  </div>`;
}
function renderProjectDetail(){
  const p = byId(DATA.projects, ui.projectId);
  if(!p) return `<div class="empty">Proyecto no encontrado.</div>`;
  const tabs = [
    {v:"resumen", l:"Resumen"},
    {v:"tareas", l:"Tareas"},
    {v:"cronograma", l:"Cronograma"},
    {v:"archivos", l:"Archivos"},
    {v:"equipo", l:"Equipo"}
  ];
  const pt = activeTasks().filter(t=>t.projectId===p.id);
  let content = "";
  if(ui.projectTab==="resumen"){
    const esta = pt.filter(t=>t.week==="esta"&&!t.onHold).length;
    const espera = pt.filter(t=>t.onHold).length;
    const vencidas = pt.filter(isOverdue).length;
    const proxTareas = pt.slice(0,5);
    const equipo = [...new Set(pt.map(t=>t.responsible))];
    content = `
      <div class="stat-grid">
        <div class="stat-card"><div class="num">${pt.length}</div><div class="lbl">Pendientes</div></div>
        <div class="stat-card"><div class="num">${esta}</div><div class="lbl">Esta semana</div></div>
        <div class="stat-card"><div class="num">${espera}</div><div class="lbl">En espera</div></div>
        <div class="stat-card warn"><div class="num">${vencidas}</div><div class="lbl">Vencidas</div></div>
      </div>
      <section class="block">
        <div class="block-head"><div class="block-title">Tareas próximas</div></div>
        ${proxTareas.length? proxTareas.map(t=>taskTicket(t)).join("") : `<div class="empty">No hay tareas pendientes.</div>`}
      </section>
      <section class="block">
        <div class="block-head"><div class="block-title">Equipo en este proyecto</div></div>
        ${equipo.length? equipo.map(uid=>`<div class="ticket" style="cursor:default;border-left-color:var(--line-strong);"><div class="t-main"><div class="t-name">${esc(userName(uid))}</div><div class="t-meta">${pt.filter(t=>t.responsible===uid).length} tareas asignadas</div></div></div>`).join("") : `<div class="empty">Sin asignaciones aún.</div>`}
      </section>
    `;
  } else if(ui.projectTab==="tareas"){
    content = pt.length? pt.map(t=>taskTicket(t)).join("") : `<div class="empty">No hay tareas en este proyecto.</div>`;
    content += `<div style="margin-top:14px;"><button class="btn secondary" data-newtask-project="${p.id}">+ Nueva tarea en este proyecto</button></div>`;
  } else if(ui.projectTab==="cronograma"){
    const importBar = `
      <div style="margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <button class="btn secondary" data-import-excel="${p.id}">⭱ ${p.gantt?'Reimportar':'Importar'} desde Excel</button>
        <span style="font-size:11.5px;color:var(--ink-soft);">Sube tu archivo .xlsx del cronograma semanal (capítulo, actividad, semanas coloreadas)</span>
      </div>`;
    if(p.gantt){
      content = importBar + renderGanttTable(p);
    } else {
      const stages = p.stages || [];
      content = importBar + (stages.length? stages.map(st=>stageCard(st,p)).join("") : `<div class="empty">Sin cronograma todavía. Impórtalo desde Excel o crea una etapa manual.</div>`)
        + `<div style="margin-top:14px;"><button class="btn ghost small" data-newstage-project="${p.id}">+ Nueva etapa manual</button></div>`;
    }
  } else {
    content = `<div class="empty">Esta sección (${tabs.find(t=>t.v===ui.projectTab).l}) queda para la fase 2 del producto.</div>`;
  }

  return `
    <div style="margin-bottom:8px;"><span class="chip" data-nav="projects" style="cursor:pointer;">← Proyectos</span></div>
    <div class="page-head">
      <div>
        <h1 class="page-title">${esc(p.name)}</h1>
        <div class="page-date mono">${esc(p.client)} · ${esc(p.location)} · entrega ${fmtDate(p.due)}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-start;">
        <button class="btn ghost small" data-edit-project="${p.id}">✎ Editar</button>
        <select class="mini" data-change-project-status="${p.id}" style="height:fit-content;">
          <option value="Pendiente" ${p.status==="Pendiente"?"selected":""}>Pendiente</option>
          <option value="Activo" ${p.status==="Activo"?"selected":""}>Activo</option>
          <option value="Pausa" ${p.status==="Pausa"?"selected":""}>En pausa</option>
          <option value="Finalizado" ${p.status==="Finalizado"?"selected":""}>Finalizado</option>
        </select>
      </div>
    </div>
    <div class="tabs">
      ${tabs.map(t=>`<div class="tab-btn ${ui.projectTab===t.v?'active':''}" data-project-tab="${t.v}">${t.l}</div>`).join("")}
    </div>
    ${content}
  `;
}

function renderActivities(){
  const active = activeTasks();
  const acts = DATA.activities || [];
  return `
    <div class="page-head">
      <div><h1 class="page-title">Actividades</h1></div>
      <button class="btn" data-add-activity="1">+ Nueva actividad</button>
    </div>
    ${acts.length? `<div class="act-grid">
      ${acts.map(a=>{
        const c = active.filter(t=>t.activity===a).length;
        return `<div class="act-card" data-open-activity="${a}" style="position:relative;">
          <div class="num">${c}</div><div class="lbl">${a}</div>
          <button class="btn ghost small" data-rename-activity="${esc(a)}" style="position:absolute;top:8px;right:8px;padding:2px 6px;" title="Renombrar">✎</button>
        </div>`;
      }).join("")}
    </div>` : `<div class="empty">Todavía no hay actividades. Usa "+ Nueva actividad" para crear la primera (ej. Presupuestos, Compras, Diseños).</div>`}
  `;
}

function renderActivityDetail(){
  const a = ui.activity;
  const items = activeTasks().filter(t=>t.activity===a);
  return `
    <div style="margin-bottom:8px;"><span class="chip" data-nav="activities" style="cursor:pointer;">← Actividades</span></div>
    <div class="page-head">
      <h1 class="page-title" style="margin-bottom:0;">${esc(a)}</h1>
      <button class="btn ghost small" data-rename-activity="${esc(a)}">✎ Renombrar</button>
    </div>
    <table class="data">
      <thead><tr><th>Tarea</th><th>Proyecto</th><th>Responsable</th><th>Semana</th><th>Deadline</th></tr></thead>
      <tbody>
        ${items.length? items.map(t=>`
          <tr data-open-task="${t.id}">
            <td>${esc(t.name)}</td>
            <td>${esc(projectName(t.projectId))}</td>
            <td>${esc(userName(t.responsible))}</td>
            <td>${t.onHold? 'En espera' : (t.week==="esta"?"Esta":t.week==="proxima"?"Próxima":"—")}</td>
            <td>${t.deadline? fmtDate(t.deadline):"—"}</td>
          </tr>`).join("") : `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);">Sin tareas.</td></tr>`}
      </tbody>
    </table>
  `;
}

/* ============ MODALS ============ */
function fieldProjectOptions(sel){
  return `<option value="" ${!sel?'selected':''}>Personal (sin proyecto)</option>` +
    DATA.projects.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)}</option>`).join("");
}
function fieldUserOptions(sel){
  return DATA.users.map(u=>`<option value="${u.id}" ${sel===u.id?'selected':''}>${esc(u.name)}</option>`).join("");
}
function fieldActivityOptions(sel){
  const acts = DATA.activities || [];
  return acts.map(a=>`<option value="${a}" ${sel===a?'selected':''}>${a}</option>`).join("") + `<option value="__new__">+ Nueva actividad…</option>`;
}

            <div class="detail-row"><span class="k">Fecha límite</span><span class="v">${t.deadline? fmtDate(t.deadline) : "—"}</span></div>
            ${t.repeat && t.repeat!=="none"? `<div class="detail-row"><span class="k">Repite</span><span class="v">${t.repeat==="quincenal"?"Cada 15 días":"Cada mes"}</span></div>` : ""}
          </div>
          ${t.onHold? `
          <div class="hold-box">
            <div><b>Esperando a:</b> ${esc(t.holdWaiting||'—')}</div>
            <div style="margin-top:4px;">${esc(t.holdReason||'')}</div>
            <div style="margin-top:4px;"><b>Revisar:</b> ${t.holdReview? fmtDate(t.holdReview):'—'}</div>
          </div>`:""}
          <div class="detail-actions">
            ${!t.completed? `<button class="btn" data-detail-complete="${t.id}">✓ Completar</button>` : `<button class="btn secondary" data-detail-reopen="${t.id}">↺ Reabrir</button>`}
            ${!t.inMyDay? `<button class="btn secondary" data-detail-myday="add" data-tid="${t.id}">+ Añadir a Mi día</button>` : `<button class="btn secondary" data-detail-myday="remove" data-tid="${t.id}">− Quitar de Mi día</button>`}
            ${!t.onHold? `<button class="btn ghost" data-detail-hold="${t.id}">Poner en espera</button>` : `<button class="btn ghost" data-detail-resume="${t.id}">Reanudar</button>`}
          </div>
          <div class="field"><label>Descripción</label><textarea id="d-desc" data-desc-task="${t.id}">${esc(t.description||"")}</textarea></div>
          <div class="menu-actions">
            <button class="btn ghost small" data-detail-edit="${t.id}">Editar</button>
            <button class="btn ghost small" data-detail-duplicate="${t.id}">Duplicar</button>
            <button class="btn ghost small" data-detail-delete="${t.id}">Eliminar</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  root.innerHTML = html;
}

/* ============ EVENT HANDLERS ============ */
function attachHandlers(){
  const app = document.getElementById("app");
  const modalRoot = document.getElementById("modal-root");

  // Access lock
  const lockSubmit = app.querySelector("[data-lock-submit]");
  if(lockSubmit){
    const tryUnlock = ()=>{
      const val = document.getElementById("lock-pass").value;
      if(val === APP_PASSWORD){
        localStorage.setItem("obra:unlocked", "1");
        render();
      } else {
        const err = document.getElementById("lock-error");
        if(err) err.style.display = "block";
      }
    };
    lockSubmit.addEventListener("click", tryUnlock);
    const passInput = document.getElementById("lock-pass");
    if(passInput) passInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") tryUnlock(); });
  }

  // Team setup (first run)
  const setupAdd = app.querySelector("[data-setup-add]");
  if(setupAdd) setupAdd.addEventListener("click", ()=>{
    const name = document.getElementById("su-name").value.trim();
    if(!name){ document.getElementById("su-name").style.borderColor="var(--rust)"; return; }
    const role = document.getElementById("su-role").value.trim();
    mutate(()=>{
      DATA.users.push({id:"u"+Date.now(), name, role});
    });
  });
  const setupContinue = app.querySelector("[data-setup-continue]");
  if(setupContinue) setupContinue.addEventListener("click", ()=>{ render(); });

  // Who am I (per-device identity, not shared)
  app.querySelectorAll("[data-whoami-pick]").forEach(el=>{
    el.addEventListener("click", ()=>{
      LOCAL_USER = el.getAttribute("data-whoami-pick");
      localStorage.setItem("obra:whoami", LOCAL_USER);
      render();
    });
  });
  const whoamiNew = app.querySelector("[data-whoami-new]");
  if(whoamiNew) whoamiNew.addEventListener("click", ()=>{
    const name = prompt("¿Cómo te llamas?");
    if(!name || !name.trim()) return;
    const role = prompt("¿Cuál es tu rol? (opcional)") || "";
    const newId = "u"+Date.now();
    mutate(()=>{ DATA.users.push({id:newId, name:name.trim(), role:role.trim()}); }).then(()=>{
      LOCAL_USER = newId;
      localStorage.setItem("obra:whoami", LOCAL_USER);
      render();
    });
  });

  // Add activity (from Actividades screen)
  const addActivityBtn = app.querySelector("[data-add-activity]");
  if(addActivityBtn) addActivityBtn.addEventListener("click", ()=>{
    const name = prompt("Nombre de la nueva actividad (ej. Presupuestos, Compras, Diseños):");
    if(!name || !name.trim()) return;
    const clean = name.trim();
    if(DATA.activities.includes(clean)){ alert("Esa actividad ya existe."); return; }
    mutate(()=>{ DATA.activities.push(clean); });
  });

  // Rename an existing activity (updates the activity list and every task using it)
  app.querySelectorAll("[data-rename-activity]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const oldName = el.getAttribute("data-rename-activity");
      const name = prompt("Nuevo nombre para la actividad:", oldName);
      if(!name || !name.trim()) return;
      const clean = name.trim();
      if(clean === oldName) return;
      if(DATA.activities.includes(clean)){ alert("Ya existe una actividad con ese nombre."); return; }
      mutate(()=>{
        const idx = DATA.activities.indexOf(oldName);
        if(idx !== -1) DATA.activities[idx] = clean;
        DATA.tasks.forEach(t=>{ if(t.activity === oldName) t.activity = clean; });
        if(ui.activity === oldName) ui.activity = clean;
      });
    });
  });

  // Nav
  app.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const view = el.getAttribute("data-nav");
      const filter = el.getAttribute("data-filter");
      setView(view, filter? {tasksFilter: filter==='espera'?'espera':filter} : null);
    });
  });

  // FAB
  const fabBtn = document.getElementById("fabBtn");
  if(fabBtn) fabBtn.addEventListener("click", ()=>{ ui.fabOpen = !ui.fabOpen; render(); });
  app.querySelectorAll("[data-fab]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const a = el.getAttribute("data-fab");
      if(a==="newTask") openModal("newTask", {});
      else if(a==="quickTask") openModal("quickTask", {});
      else if(a==="newProject") openModal("newProject", {});
      else if(a==="fromMyTasks") openModal("fromMyTasks", {});
    });
  });

  // Open task / project / activity
  app.querySelectorAll("[data-open-task]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      if(e.target.closest("[data-toggle-complete]") || e.target.closest("[data-select-task]")) return;
      openModal("taskDetail", {taskId: el.getAttribute("data-open-task")});
    });
  });
  app.querySelectorAll("[data-open-project]").forEach(el=>{
    el.addEventListener("click", ()=> setView("projectDetail", {projectId: el.getAttribute("data-open-project"), projectTab:"resumen"}));
  });
  app.querySelectorAll("[data-open-activity]").forEach(el=>{
    el.addEventListener("click", ()=> setView("activityDetail", {activity: el.getAttribute("data-open-activity")}));
  });
  app.querySelectorAll("[data-project-tab]").forEach(el=>{
    el.addEventListener("click", ()=>{ ui.projectTab = el.getAttribute("data-project-tab"); render(); });
  });
  app.querySelectorAll("[data-projects-filter]").forEach(el=>{
    el.addEventListener("click", ()=>{ ui.projectsFilter = el.getAttribute("data-projects-filter"); render(); });
  });
  app.querySelectorAll("[data-change-project-status]").forEach(el=>{
    el.addEventListener("change", ()=>{
      const pid = el.getAttribute("data-change-project-status");
      mutate(()=>{ const proj = byId(DATA.projects, pid); if(proj) proj.status = el.value; });
    });
  });
  app.querySelectorAll("[data-edit-project]").forEach(el=>{
    el.addEventListener("click", ()=> openModal("editProject", {projectId: el.getAttribute("data-edit-project")}));
  });
  app.querySelectorAll("[data-newtask-project]").forEach(el=>{
    el.addEventListener("click", ()=> openModal("newTask", {projectId: el.getAttribute("data-newtask-project")}));
  });
  app.querySelectorAll("[data-newstage-project]").forEach(el=>{
    el.addEventListener("click", ()=> openModal("newStage", {projectId: el.getAttribute("data-newstage-project")}));
  });
  app.querySelectorAll("[data-move-stage]").forEach(el=>{
    el.addEventListener("click", ()=> openModal("moveStage", {projectId: el.getAttribute("data-project"), stageId: el.getAttribute("data-move-stage")}));
  });
  app.querySelectorAll("[data-import-excel]").forEach(el=>{
    el.addEventListener("click", ()=>{
      excelImportProjectId = el.getAttribute("data-import-excel");
      const inp = document.getElementById("excelFileInput");
      if(inp) inp.click();
    });
  });
  const excelInput = document.getElementById("excelFileInput");
  if(excelInput) excelInput.onchange = handleExcelImport;

  // toggle complete inline
  app.querySelectorAll("[data-toggle-complete]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const id = el.getAttribute("data-toggle-complete");
      mutate(()=>{ const t=taskById(id); t.completed=!t.completed; t.completedDate = t.completed? TODAY : null; if(t.completed) maybeSpawnRecurrence(t); });
    });
  });

  // multi-select
  app.querySelectorAll("[data-select-task]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const id = el.getAttribute("data-select-task");
      if(ui.selectedTaskIds.has(id)) ui.selectedTaskIds.delete(id); else ui.selectedTaskIds.add(id);
      render();
    });
  });
  app.querySelectorAll("[data-tasks-filter]").forEach(el=>{
    el.addEventListener("click", ()=>{ ui.tasksFilter = el.getAttribute("data-tasks-filter"); ui.selectedTaskIds=new Set(); render(); });
  });
  app.querySelectorAll("[data-bulk]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const a = el.getAttribute("data-bulk");
      if(a==="clear"){ ui.selectedTaskIds=new Set(); render(); return; }
      mutate(()=>{
        ui.selectedTaskIds.forEach(id=>{
          const t = taskById(id);
          if(a==="myday"){ t.inMyDay=true; t.myDayDate=TODAY; }
          else if(a==="proxima"){ t.week="proxima"; }
        });
        ui.selectedTaskIds = new Set();
      });
    });
  });

  // stale my-day banner actions
  app.querySelectorAll("[data-stale-action]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const action = el.getAttribute("data-stale-action");
      const id = el.getAttribute("data-id");
      mutate(()=>{
        const t = taskById(id);
        if(action==="today"){ t.myDayDate = TODAY; }
        else if(action==="done"){ t.completed=true; t.completedDate=TODAY; maybeSpawnRecurrence(t); }
        else if(action==="return"){ t.inMyDay=false; }
      });
    });
  });

  // Modal generic close
  modalRoot.querySelectorAll("[data-close]").forEach(el=> el.addEventListener("click", closeModal));
  const overlay = document.getElementById("overlayEl");
  if(overlay) overlay.addEventListener("click", (e)=>{ if(e.target.id==="overlayEl") closeModal(); });

  // Handle "+ Nueva actividad..." inline creation from the task form's activity select
  const fActivitySel = document.getElementById("f-activity");
  if(fActivitySel) fActivitySel.addEventListener("change", ()=>{
    if(fActivitySel.value !== "__new__") return;
    const name = prompt("Nombre de la nueva actividad:");
    if(!name || !name.trim()){ fActivitySel.value = (DATA.activities&&DATA.activities[0])||"__new__"; return; }
    const clean = name.trim();
    mutate(()=>{ if(!DATA.activities.includes(clean)) DATA.activities.push(clean); }).then(()=>{
      const reopenType = ui.modal && ui.modal.type;
      const payload = ui.modal && ui.modal.payload;
      if(reopenType){ openModal(reopenType, payload); }
      setTimeout(()=>{ const s=document.getElementById("f-activity"); if(s) s.value=clean; }, 0);
    });
  });

  // Save task (new/edit)
  modalRoot.querySelectorAll("[data-save-task]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const mode = el.getAttribute("data-save-task");
      const name = document.getElementById("f-name").value.trim();
      if(!name){ document.getElementById("f-name").style.borderColor="var(--rust)"; return; }
      const vals = {
        name,
        projectId: document.getElementById("f-project").value || null,
        activity: document.getElementById("f-activity").value,
        responsible: document.getElementById("f-responsible").value,
        priority: document.getElementById("f-priority").value,
        week: document.getElementById("f-week").value || null,
        deadline: document.getElementById("f-deadline").value || null,
        repeat: document.getElementById("f-repeat") ? document.getElementById("f-repeat").value : "none",
        description: document.getElementById("f-desc").value
      };
      if(mode==="edit"){
        const tid = el.getAttribute("data-tid");
        mutate(()=>{ Object.assign(taskById(tid), vals); });
        openModal("taskDetail", {taskId: tid});
      } else {
        mutate(()=>{ DATA.tasks.push(newTaskTemplate(vals)); });
        if(mode==="another"){ openModal("newTask", {}); }
        else { closeModal(); }
      }
    });
  });

  // quick task
  let quickCat = "Personal";
  modalRoot.querySelectorAll("[data-quick-cat]").forEach(el=>{
    el.addEventListener("click", ()=>{
      modalRoot.querySelectorAll("[data-quick-cat]").forEach(c=>c.classList.remove("selected"));
      el.classList.add("selected");
      quickCat = el.getAttribute("data-quick-cat");
    });
  });
  const saveQuick = modalRoot.querySelector("[data-save-quick]");
  if(saveQuick) saveQuick.addEventListener("click", ()=>{
    const name = document.getElementById("q-name").value.trim();
    if(!name) return;
    mutate(()=>{
      if(!DATA.activities.includes(quickCat)) DATA.activities.push(quickCat);
      DATA.tasks.push(newTaskTemplate({name, activity: quickCat, projectId:null, inMyDay:true, myDayDate:TODAY, week:"esta"}));
    });
    closeModal();
  });

  // from my tasks -> add to my day
  const confirmAdd = modalRoot.querySelector("[data-confirm-add-myday]");
  if(confirmAdd) confirmAdd.addEventListener("click", ()=>{
    const picked = Array.from(modalRoot.querySelectorAll("[data-pick-task]:checked")).map(el=>el.getAttribute("data-pick-task"));
    mutate(()=>{ picked.forEach(id=>{ const t=taskById(id); t.inMyDay=true; t.myDayDate=TODAY; }); });
    closeModal();
  });

  // new project
  const saveProject = modalRoot.querySelector("[data-save-project]");
  if(saveProject) saveProject.addEventListener("click", ()=>{
    const name = document.getElementById("p-name").value.trim();
    if(!name) return;
    mutate(()=>{
      DATA.projects.push({
        id: "p"+(DATA.projects.length+1)+"_"+Date.now(),
        name, status: (document.getElementById("p-status") ? document.getElementById("p-status").value : "Activo"),
        client: document.getElementById("p-client").value,
        location: document.getElementById("p-location").value,
        start: document.getElementById("p-start").value || TODAY,
        due: document.getElementById("p-due").value || null
      });
    });
    closeModal();
  });

  // save edited project
  const saveEditProject = modalRoot.querySelector("[data-save-edit-project]");
  if(saveEditProject) saveEditProject.addEventListener("click", ()=>{
    const pid = saveEditProject.getAttribute("data-save-edit-project");
    const name = document.getElementById("ep-name").value.trim();
    if(!name){ document.getElementById("ep-name").style.borderColor="var(--rust)"; return; }
    mutate(()=>{
      const proj = byId(DATA.projects, pid);
      if(proj){
        proj.name = name;
        proj.client = document.getElementById("ep-client").value;
        proj.location = document.getElementById("ep-location").value;
        proj.start = document.getElementById("ep-start").value || proj.start;
        proj.due = document.getElementById("ep-due").value || null;
      }
    });
    closeModal();
  });

  // new stage
  const saveStage = modalRoot.querySelector("[data-save-stage]");
  if(saveStage) saveStage.addEventListener("click", ()=>{
    const pid = saveStage.getAttribute("data-save-stage");
    const name = document.getElementById("s-name").value.trim();
    if(!name){ document.getElementById("s-name").style.borderColor="var(--rust)"; return; }
    const start = document.getElementById("s-start").value || null;
    const end = document.getElementById("s-end").value || null;
    const status = document.getElementById("s-status").value;
    mutate(()=>{
      const proj = byId(DATA.projects, pid);
      if(!proj.stages) proj.stages = [];
      proj.stages.push({id:"st"+Date.now(), name, plannedStart:start, plannedEnd:end, currentStart:start, currentEnd:end, status, notes:""});
    });
    closeModal();
  });

  // move stage confirm
  const confirmMoveStage = modalRoot.querySelector("[data-confirm-move-stage]");
  if(confirmMoveStage) confirmMoveStage.addEventListener("click", ()=>{
    const pid = confirmMoveStage.getAttribute("data-project");
    const sid = confirmMoveStage.getAttribute("data-stage");
    const newStart = document.getElementById("m-start").value || null;
    const newEnd = document.getElementById("m-end").value || null;
    const status = document.getElementById("m-status").value;
    const cascade = document.getElementById("m-cascade").checked;
    mutate(()=>{
      const proj = byId(DATA.projects, pid);
      const stages = proj.stages || [];
      const idx = stages.findIndex(s=>s.id===sid);
      if(idx===-1) return;
      const st = stages[idx];
      const oldEnd = st.currentEnd || st.plannedEnd;
      const diffDays = (oldEnd && newEnd) ? Math.round((new Date(newEnd+"T00:00:00") - new Date(oldEnd+"T00:00:00"))/86400000) : 0;
      st.currentStart = newStart; st.currentEnd = newEnd; st.status = status;
      if(cascade && diffDays!==0){
        for(let i=idx+1;i<stages.length;i++){
          const s2 = stages[i];
          const s2Start = s2.currentStart || s2.plannedStart;
          const s2End = s2.currentEnd || s2.plannedEnd;
          if(s2Start) s2.currentStart = shiftDate(s2Start, diffDays);
          if(s2End) s2.currentEnd = shiftDate(s2End, diffDays);
        }
      }
    });
    closeModal();
  });

  // on hold confirm
  const confirmHold = modalRoot.querySelector("[data-confirm-hold]");
  if(confirmHold) confirmHold.addEventListener("click", ()=>{
    const tid = confirmHold.getAttribute("data-confirm-hold");
    const reason = document.getElementById("h-reason").value;
    const waiting = document.getElementById("h-waiting").value;
    const review = document.getElementById("h-review").value;
    mutate(()=>{
      const t = taskById(tid);
      t.onHold=true; t.holdReason=reason; t.holdWaiting=waiting; t.holdReview=review; t.inMyDay=false;
    });
    openModal("taskDetail", {taskId: tid});
  });

  // task detail actions
  const q = (sel)=> modalRoot.querySelector(sel);
  const dComplete = q("[data-detail-complete]");
  if(dComplete) dComplete.addEventListener("click", ()=>{
    const id = dComplete.getAttribute("data-detail-complete");
    mutate(()=>{ const t=taskById(id); t.completed=true; t.completedDate=TODAY; maybeSpawnRecurrence(t); });
    openModal("taskDetail", {taskId:id});
  });
  const dReopen = q("[data-detail-reopen]");
  if(dReopen) dReopen.addEventListener("click", ()=>{
    const id = dReopen.getAttribute("data-detail-reopen");
    mutate(()=>{ const t=taskById(id); t.completed=false; });
    openModal("taskDetail", {taskId:id});
  });
  modalRoot.querySelectorAll("[data-detail-myday]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const mode = el.getAttribute("data-detail-myday");
      const id = el.getAttribute("data-tid");
      mutate(()=>{ const t=taskById(id); if(mode==="add"){t.inMyDay=true;t.myDayDate=TODAY;} else {t.inMyDay=false;} });
      openModal("taskDetail", {taskId:id});
    });
  });
  const dHold = q("[data-detail-hold]");
  if(dHold) dHold.addEventListener("click", ()=> openModal("onHold", {taskId: dHold.getAttribute("data-detail-hold")}));
  const dResume = q("[data-detail-resume]");
  if(dResume) dResume.addEventListener("click", ()=>{
    const id = dResume.getAttribute("data-detail-resume");
    mutate(()=>{ const t=taskById(id); t.onHold=false; t.holdReason=null; t.holdWaiting=null; t.holdReview=null; });
    openModal("taskDetail", {taskId:id});
  });
  const dEdit = q("[data-detail-edit]");
  if(dEdit) dEdit.addEventListener("click", ()=> openModal("editTask", {task: taskById(dEdit.getAttribute("data-detail-edit"))}));
  const dDup = q("[data-detail-duplicate]");
  if(dDup) dDup.addEventListener("click", ()=>{
    const id = dDup.getAttribute("data-detail-duplicate");
    mutate(()=>{
      const orig = taskById(id);
      const copy = Object.assign({}, orig, {id:"t"+(DATA.nextTaskNum++), name: orig.name + " (copia)", completed:false, onHold:false, inMyDay:false});
      DATA.tasks.push(copy);
    });
    closeModal();
  });
  const dDel = q("[data-detail-delete]");
  if(dDel) dDel.addEventListener("click", ()=>{
    const id = dDel.getAttribute("data-detail-delete");
    mutate(()=>{ DATA.tasks = DATA.tasks.filter(t=>t.id!==id); });
    closeModal();
  });
  const descArea = q("[data-desc-task]");
  if(descArea) descArea.addEventListener("blur", ()=>{
    const id = descArea.getAttribute("data-desc-task");
    mutate(()=>{ taskById(id).description = descArea.value; });
  });
}

/* ============ INIT ============ */
(async function init(){
  document.getElementById("app").innerHTML = `<div style="padding:60px;font-family:'IBM Plex Mono',monospace;color:#4A5568;">Cargando bitácora…</div>`;
  await loadData();
  render();
})();
</script>
</body>
</html>
